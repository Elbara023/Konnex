<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konnex Mint Countdown</title>
  <style>
    :root {
      --bg: #050505;
      --panel: rgba(8, 8, 8, 0.62);
      --line: rgba(255, 255, 255, 0.2);
      --text: #f4f4f4;
      --muted: #bdbdbd;
      --danger: #ff6767;
      --glow: 0 0 16px rgba(131, 245, 255, 0.65);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000;
    }

    .bg-media {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(88vmin, 680px);
      height: min(88vmin, 680px);
      transform: translate(-50%, -50%);
      background-image: url("./public/konnex-background.gif"), url("./public/konnex-background.png"), url("./public/dragon-head-logo.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      opacity: 0.33;
      filter: grayscale(0.15) contrast(1.05);
      animation: spin 26s linear infinite;
    }

    .bg-fade {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.84) 70%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.8));
    }

    @keyframes spin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(8px);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      padding: 24px 22px;
      text-align: center;
    }

    .live {
      margin: 0 0 10px;
      color: var(--danger);
      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: 1px;
    }

    .sub {
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: clamp(14px, 2.5vw, 18px);
    }

    .timer {
      margin: 8px auto 14px;
      border: 1px solid rgba(131, 245, 255, 0.35);
      border-radius: 12px;
      padding: 14px 12px;
      background: rgba(0, 0, 0, 0.55);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(24px, 5.8vw, 58px);
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: var(--glow);
      line-height: 1.15;
      transition: transform 0.18s ease, color 0.2s ease;
    }

    .timer.tick { transform: scale(1.015); }

    .labels {
      margin: 0 0 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .info {
      margin: 0 0 12px;
      font-size: 14px;
      color: #f0c9c9;
    }

    .cta {
      display: inline-block;
      margin-top: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 18px;
      border-radius: 11px;
      color: #030507;
      background: linear-gradient(90deg, #83f5ff, #b5a6ff);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .cta:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 22px rgba(131, 245, 255, 0.7);
    }

    .small {
      margin-top: 10px;
      font-size: 12px;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <div class="bg-wrap" aria-hidden="true">
    <div class="bg-media"></div>
    <div class="bg-fade"></div>
  </div>

  <main class="page">
    <p class="live">● LIVE COUNTDOWN</p>
    <h1>KONNEX MINT ENDS SOON</h1>
    <p class="sub">Live countdown until the Konnex Autonomous Units mint event ends.</p>

    <div class="timer" id="timer">--:--:--:--</div>
    <div class="labels">
      <span>Days</span>
      <span>Hours</span>
      <span>Minutes</span>
      <span>Seconds</span>
    </div>

    <p class="info" id="statusText">Only a short time remains before the event ends.</p>

    <a
      id="mintLink"
      class="cta"
      href="https://opensea.io/collection/konnex-autonomous-units"
      target="_blank"
      rel="noopener noreferrer"
    >
      OPEN MINT PAGE
    </a>

    <div class="small">Background media loads from <code>public/konnex-background.gif</code>.</div>
  </main>

  <script>
    "use strict";

    // 23 Mar 2026 23:59:59 at UTC+03:00 -> absolute UTC timestamp.
    // Using fixed UTC milliseconds keeps the same end moment for every country.
    const END_DATE_UTC_MS = Date.UTC(2026, 2, 23, 20, 59, 59);

    const timerEl = document.getElementById("timer");
    const statusEl = document.getElementById("statusText");
    const mintLinkEl = document.getElementById("mintLink");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function formatLeft(msLeft) {
      const totalSec = Math.max(0, Math.floor(msLeft / 1000));
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      return { days: pad(days), hours: pad(hours), minutes: pad(minutes), seconds: pad(seconds) };
    }

    function updateCountdown() {
      const distance = END_DATE_UTC_MS - Date.now();
      const left = formatLeft(distance);

      timerEl.classList.remove("tick");
      void timerEl.offsetWidth;
      timerEl.classList.add("tick");
      timerEl.textContent = left.days + ":" + left.hours + ":" + left.minutes + ":" + left.seconds;

      if (distance <= 0) {
        timerEl.textContent = "00:00:00:00";
        timerEl.style.color = "#ff6767";
        statusEl.textContent = "Mint is closed.";
        mintLinkEl.textContent = "VIEW COLLECTION";
        return false;
      }

      timerEl.style.color = distance < 3600000 ? "#ff8a8a" : "#f4f4f4";
      return true;
    }

    const intervalId = setInterval(() => {
      if (!updateCountdown()) clearInterval(intervalId);
    }, 1000);
    updateCountdown();
  </script>
</body>
</html>
