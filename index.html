<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konnex Mint Countdown</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: rgba(0, 0, 0, 0);
      --line: rgba(131, 245, 255, 1);
      --text: #000000;
      --muted: #000000;
      --danger: #000000;
      --glow: none;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    body {
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #000000;
      perspective: 1200px;
    }

    .bg-media {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(500vw, 4800px);
      height: min(260vmin, 2100px);
      transform: translate(-50%, -50%) rotateY(0deg);
      opacity: 1;
      animation: spinHorizontal 20s linear infinite;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .bg-media img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: brightness(1.15) contrast(1.1) saturate(1.12) opacity(0.58);
    }

    .bg-fade {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.36) 72%);
    }

    @keyframes spinHorizontal {
      from { transform: translate(-50%, -50%) rotateY(0deg); }
      to { transform: translate(-50%, -50%) rotateY(360deg); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      border: 3px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: none;
      box-shadow: 0 0 22px rgba(131, 245, 255, 0.38), inset 0 0 10px rgba(131, 245, 255, 0.12);
      padding: 24px 22px;
      text-align: center;
    }

    .live {
      margin: 0 0 10px;
      color: var(--danger);
      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      letter-spacing: 1px;
    }

    .sub {
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: clamp(14px, 2.5vw, 18px);
    }

    .timer {
      margin: 8px auto 14px;
      border: 3px solid rgba(131, 245, 255, 1);
      border-radius: 12px;
      padding: 14px 12px;
      background: rgba(0, 0, 0, 0);
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(24px, 5.8vw, 58px);
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: var(--glow);
      line-height: 1.15;
      transition: transform 0.18s ease, color 0.2s ease;
      box-shadow: 0 0 20px rgba(131, 245, 255, 0.38), inset 0 0 8px rgba(131, 245, 255, 0.1);
    }

    .timer.tick { transform: scale(1.015); }

    .labels {
      margin: 0 0 18px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .info {
      margin: 0 0 12px;
      font-size: 14px;
      color: #000000;
    }

    .cta {
      display: inline-block;
      margin-top: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 18px;
      border-radius: 11px;
      color: #030507;
      background: linear-gradient(90deg, #83f5ff, #b5a6ff);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .cta:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 22px rgba(131, 245, 255, 0.7);
    }

    .small {
      margin-top: 10px;
      font-size: 12px;
      color: #000000;
    }
  </style>
</head>
<body>
  <div class="bg-wrap" aria-hidden="true">
    <div class="bg-media">
      <img src="./public/konnex-background.gif" alt="" />
    </div>
    <div class="bg-fade"></div>
  </div>

  <main class="page">
    <p class="live">● LIVE COUNTDOWN</p>
    <h1>KONNEX MINT ENDS SOON</h1>
    <p class="sub">Live countdown until the Konnex Autonomous Units mint event ends.</p>

    <div class="timer" id="timer">--:--:--:--</div>
    <div class="labels">
      <span>Days</span>
      <span>Hours</span>
      <span>Minutes</span>
      <span>Seconds</span>
    </div>

    <p class="info" id="statusText">Only a short time remains before the event ends.</p>

    <a
      id="mintLink"
      class="cta"
      href="https://opensea.io/collection/konnex-autonomous-units"
      target="_blank"
      rel="noopener noreferrer"
    >
      OPEN MINT PAGE
    </a>

  </main>

  <script>
    "use strict";

    // Event end: 23 Mar 2026, 6:00 PM at GMT+4 (fixed global moment).
    // 18:00 GMT+4 equals 14:00 UTC.
    const END_DATE_UTC_MS = Date.UTC(2026, 2, 23, 14, 0, 0);

    const timerEl = document.getElementById("timer");
    const statusEl = document.getElementById("statusText");
    const mintLinkEl = document.getElementById("mintLink");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function formatLeft(msLeft) {
      const totalSec = Math.max(0, Math.floor(msLeft / 1000));
      const days = Math.floor(totalSec / 86400);
      const hours = Math.floor((totalSec % 86400) / 3600);
      const minutes = Math.floor((totalSec % 3600) / 60);
      const seconds = totalSec % 60;
      return { days: pad(days), hours: pad(hours), minutes: pad(minutes), seconds: pad(seconds) };
    }

    function updateCountdown() {
      const distance = END_DATE_UTC_MS - Date.now();
      const left = formatLeft(distance);

      timerEl.classList.remove("tick");
      void timerEl.offsetWidth;
      timerEl.classList.add("tick");
      timerEl.textContent = left.days + ":" + left.hours + ":" + left.minutes + ":" + left.seconds;

      if (distance <= 0) {
        timerEl.textContent = "00:00:00:00";
        timerEl.style.color = "#000000";
        statusEl.textContent = "Mint is closed.";
        mintLinkEl.textContent = "VIEW COLLECTION";
        return false;
      }

      timerEl.style.color = "#000000";
      return true;
    }

    const intervalId = setInterval(() => {
      if (!updateCountdown()) clearInterval(intervalId);
    }, 1000);
    updateCountdown();
  </script>
</body>
</html>
